<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0b1f16" />
    <title>Penochao offline</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: ui-sans-serif, system-ui, sans-serif;
        background:
          radial-gradient(circle at top, rgba(34, 197, 94, 0.18), transparent 30%),
          linear-gradient(180deg, #08130e 0%, #0b1f16 55%, #06110c 100%);
        color: #f0fdf4;
      }

      .card {
        width: min(100%, 420px);
        border: 1px solid rgba(167, 243, 208, 0.16);
        background: rgba(10, 20, 15, 0.82);
        backdrop-filter: blur(14px);
        border-radius: 28px;
        padding: 28px;
        box-shadow: 0 28px 70px rgba(0, 0, 0, 0.36);
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 11px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #86efac;
      }

      h1 {
        margin: 18px 0 10px;
        font-size: 32px;
        line-height: 1.05;
      }

      p {
        margin: 0;
        color: rgba(240, 253, 244, 0.72);
        line-height: 1.55;
      }

      .actions {
        display: flex;
        gap: 12px;
        margin-top: 24px;
      }

      a,
      button {
        appearance: none;
        border: 0;
        border-radius: 999px;
        padding: 12px 18px;
        font: inherit;
        cursor: pointer;
      }

      a {
        background: linear-gradient(135deg, #22c55e, #15803d);
        color: white;
        text-decoration: none;
      }

      button {
        background: rgba(255, 255, 255, 0.08);
        color: #dcfce7;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge">Penochao offline</div>
      <h1>Sem conexao agora.</h1>
      <p>
        O app nao conseguiu carregar novos dados neste momento. Quando a internet voltar, voce pode tentar novamente sem sair daqui.
      </p>
      <div class="actions">
        <button type="button" onclick="window.location.reload()">Tentar novamente</button>
        <a href="/">Ir para inicio</a>
      </div>
    </main>
  </body>
</html>
